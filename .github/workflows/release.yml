name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/KoronaProxy-Setup-x64.exe
            release/KoronaProxy-Setup-ia32.exe
            release/*.AppImage
            release/*.deb

      - name: Upload CLI artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cli
          if-no-files-found: error
          path: korona-cli.js

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Korona Proxy ${{ github.ref_name }}
          body: |
            Automatic build.

            - Windows: run the Setup exe (x64 = modern PCs, ia32 = 32-bit Windows)
            - Linux: AppImage (chmod +x and run, works on most distros) or .deb (Ubuntu/Debian)
            - CLI (needs Node 18+): `curl -fL https://github.com/${{ github.repository }}/releases/latest/download/korona-cli.js -o korona && sudo install -m 755 korona /usr/local/bin/korona`
          files: artifacts/*
